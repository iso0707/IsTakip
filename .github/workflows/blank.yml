name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Linux bağımlılıkları
        run: |
          sudo apt update
          sudo apt install -y automake libltdl-dev

      - name: Buildozer dosyalarını cache'le
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            bin
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install legacy-cgi setuptools

      - name: Buildozer ayarlarını düzelt
        run: |
          sed -i 's/^p4a.branch = .*/p4a.branch = develop/' buildozer.spec
          sed -i 's/^#p4a.branch = .*/p4a.branch = develop/' buildozer.spec

      - name: APK oluştur
        run: |
          for i in {1..3}; do
            echo "Deneme $i..."
            buildozer -v android debug && break
            if [ $i -lt 3 ]; then echo "Bekliyor..."; sleep 30; fi
          done
        timeout-minutes: 45

      - name: APK'y](#)
