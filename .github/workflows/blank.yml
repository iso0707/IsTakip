name: Android APK Oluştur
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Linux bağımlılıkları
        run: |
          sudo apt update
          sudo apt install -y automake libltdl-dev
      - name: Buildozer önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install legacy-cgi setuptools
      - name: Buildozer ayarlarını düzelt
        run: |
          sed -i 's/^p4a.branch = .*/p4a.branch = develop/' buildozer.spec
          sed -i 's/^#p4a.branch = .*/p4a.branch = develop/' buildozer.spec
      - name: APK oluştur
        timeout-minutes: 45
        run: |
          success=0
          for i in 1 2 3; do
            echo "Deneme $i..."
            if buildozer -v android debug; then
              success=1
              break
            fi
            if [ "$i" -lt 3 ]; then echo "Bekliyor..."; sleep 30; fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Buildozer 3 denemede de basarisiz oldu!"
            exit 1
          fi
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: IsTakip-APK
          path: bin/*.apk
